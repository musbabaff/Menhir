# ============================================================================
#  Example: a MineBlocks-era config (escraft.com.tr style), trimmed to 2 blocks,
#  plus the sections added in Menhir 2.1.0 (boss bar, respawn countdown, storage,
#  display names). It is NOT the real 7-stone config of the server — that file
#  is not part of this repository; the values below are illustrative.
#
#  The `lang`, `options.*` (legacy keys!) and `blocks.*` parts are the MineBlocks
#  layout and must load without edits; the console prints one "deprecated" hint
#  per legacy option key. Use it as a smoke test:
#      cp examples/escraft-config.yml plugins/Menhir/config.yml
#
#  Things exercised on purpose:
#   - `options.afk-integration-enabled` / `options.notification-type` (legacy AFK keys)
#   - `options.hologram-update-interval` in ticks
#   - `#ICON: %type%` line (DecentHolograms syntax) -> rendered as a rotating ItemDisplay
#   - MiniMessage gradient + legacy `&l` + per-character hex "gradient" + ItemsAdder font placeholder
#   - `tool.types` entry written as a plain string ('default: ALLOWED')
#   - identical hologram on both blocks (what `hologram-templates` removes)
#   - 2.1.0: options.bossbar, options.respawn-countdown, lang.countdown, storage,
#            blocks.<id>.display-name and a per-block bossbar / countdown override
# ============================================================================

lang:
  top:
    nobody: "&7-"
    nobody-breaks: "0"
    not_ranked: "Sırasız"
  timeout:
    message: "&cYenilenme: &f%time%"
    max-units: 2
    units:
      hour: " saat"
      hours: " saat"
      minute: " dakika"
      minutes: " dakika"
      second: " saniye"
      seconds: " saniye"
  status:
    timeout: "&cBu taş şu anda kırılamaz!"
    afk: "&cAFK iken taş kıramazsın!"
    no-permission: "&cBu taşı kırma iznin yok!"
    invalid-tool: "&cBu aletle bu taşı kıramazsın!"
  # 2.1.0 — respawn countdown texts; %time% uses the units above
  countdown:
    chat: '&8» &e&l%block_name% &7yeniden doğmasına &e&l%time% &7kaldı!'
    title: '&e&l%time%'
    subtitle: '&7%block_name% yeniden doğuyor'

options:
  afk-integration-enabled: true      # legacy -> options.afk.enabled
  notification-type: ACTIONBAR       # legacy -> options.afk.notification-type
  block-break-limit: 20
  hologram-update-interval: -1       # legacy (ticks) -> options.hologram.update-interval (seconds)
  offline-rewards: true
  # 2.1.0 — health boss bar while a stone is being hit
  bossbar:
    enabled: true
    show-to: RADIUS                  # HITTER | RADIUS | WORLD
    radius: 32
    hide-after: 8                    # seconds after the last hit
    update-interval: 5               # ticks
    max-bars-per-player: 1
    color: RED
    style: NOTCHED_20
    color-thresholds:
      - { above: 66, color: GREEN }
      - { above: 33, color: YELLOW }
      - { above: 0,  color: RED }
    title: '&6&l%block_name% &8| &f%health%&7/&f%max_health% &8(&e%percent%%&8) &8| &7Sıran: &e%my_rank%'
    broken-title: '&c&l%block_name% &8| &7Yok edildi!'
    broken-linger: 3
  # 2.1.0 — announcements before a broken stone respawns
  respawn-countdown:
    enabled: true
    broadcast-to: WORLD              # SERVER | WORLD | RADIUS
    radius: 100
    warn-at: [300, 60, 10]           # 5 min, 1 min, 10 s before the respawn
    title:
      enabled: true
      only-last: true                # title only at the 10 s mark
      fade-in: 10
      stay: 40
      fade-out: 10
    sound: BLOCK_NOTE_BLOCK_PLING

# 2.1.0 — storage backend. YAML keeps everything in plugins/Menhir/storage/;
# switch to MYSQL (and run /menhir migrate yaml-to-mysql) when a second server
# should share the leaderboards.
storage:
  type: YAML                         # YAML | MYSQL
  server-id: survival                # e.g. "skyblock" on the other server
  cross-server-leaderboard: false    # true once both servers write to the same database
  flush-interval: 30
  mysql:
    host: 127.0.0.1
    port: 3306
    database: menhir
    username: ''
    password: ''
    table-prefix: 'menhir_'
    use-ssl: false
    pool-size: 6
    connection-timeout: 5000
    reconnect-interval: 60

blocks:
  metin_1:
    location:
      world: "world"
      x: 120
      y: 71
      z: -45
    type: DEEPSLATE_BRICKS
    display-name: '&6Kuzey Metin Taşı'   # 2.1.0 — %block_name%
    health: 250
    respawn-countdown:                    # 2.1.0 — per-block override: this stone is the big event
      warn-at: [600, 300, 60, 10]
      broadcast-to: SERVER
    hologram:
      offset:
        x: 0
        y: 1.2
        z: 0
      lines:
        - '#ICON: %type%'
        - '<gradient:#FF4500:#FFD700><b>METİN TAŞI</b></gradient>'
        - '%img_general_icon_16% &#FF4500E&#FF5A00S&#FF7000C&#FF8600R&#FF9C00A&#FFB200F&#FFC800T'
        - ''
        - '&6&lEN ÇOK KIRANLAR'
        - '&e#1 &f%player_1% &7- &e%player_1_breaks%'
        - '&e#2 &f%player_2% &7- &e%player_2_breaks%'
        - '&e#3 &f%player_3% &7- &e%player_3_breaks%'
        - ''
        - '&a%health%&7/&a%max_health% &7can'
        - '&c%timeout%'
    permission: ""
    break-limit: 20
    timeout:
      time: 900
      type: BEDROCK
      respawn: "&a[Metin] &fMetin taşı yeniden doğdu!"
    messages:
      break:
        - "&a[Metin] &fMetin taşı yıkıldı!"
        - "&a[Metin] &fKırma sayın: &e%breaks%"
    reset:
      inactive:
        time: -1
        message: "&7Taş iyileşti, 5 dakikadır kimse kırmadı. %breaks% kırman silindi."
      onrestart: false
    tool:
